<!doctype html>
<html lang="en" class="bg-[#0e0f12] text-white">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/tiger_logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krashis Adhikari</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: {
              DEFAULT: '#ff3030',
              hover: '#e02828',
            },
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', "sans-serif"],
            display: ['"Space Grotesk"', "sans-serif"],
            mono: ['"JetBrains Mono"', "monospace"],
          },
        },
      },
    };
  </script>

  <!-- Custom CSS utilities -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #0e0f12;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Hide scrollbar for all elements */
    * {
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE / Edge */
    }

    *::-webkit-scrollbar {
      display: none;
      /* Chrome, Safari, Opera */
    }

    /* Vertical text rotation utility for channel strips */
    .vertical-lr {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.28em;
    }

    /* Form input focus accent border */
    input:focus,
    textarea:focus {
      border-color: #ff3030 !important;
      box-shadow: none !important;
      outline: none !important;
    }
  </style>
</head>

<body class="bg-[#0e0f12] text-white font-sans antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
